cors:
  allowed-origin: <application-url>
  allowed-headers: Authorization
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  credentials: true

spring:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

saayam:
  s3:
    buckets:
      euPrivate: eu-west-1
      usPrivate: us-east-1
    maxBytes: 2097152
    allowedMime: image/jpeg,image/png,image/webp
    keyPattern: users/%s/profile
