cors:
  allowed-origin: http://localhost:5173
  allowed-headers: "*"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  credentials: true

saayam:
  s3:
    buckets:
      euPrivate: ${SAAYAM_S3_BUCKET_EU_PRIVATE:}
      usPrivate: ${SAAYAM_S3_BUCKET_US_PRIVATE:}
    maxBytes: ${SAAYAM_S3_MAX_BYTES:5242880}
    allowedMime: image/jpeg,image/png,image/webp
    keyPattern: users/%s/profile

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: welcome1
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

# Issue #222: stop aws-serverless-java-container dumping the whole process environment
# (AWS keys, DB password) to CloudWatch on every cold start.
logging:
  level:
    root: INFO
    com.amazonaws: ERROR
    com.amazonaws.serverless.proxy.spring: ERROR
