cors:
  allowed:
    origin: http://localhost:3000
    methods: GET, POST, PUT, DELETE, OPTIONS
    headers: Authorization
    credentials: true

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saayam}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
