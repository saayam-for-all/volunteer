cors:
  allowed:
    origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
    methods: GET, POST, PUT, DELETE, OPTIONS
    headers: ${CORS_ALLOWED_HEADERS:Authorization, Content-Type}
    credentials: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/saayam}
    username: ${SPRING_DATASOURCE_USERNAME:saayam}
    password: ${SPRING_DATASOURCE_PASSWORD:saayam123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}

zoom:
  api:
    base-url: ${ZOOM_API_BASE_URL:https://api.zoom.us/v2}
  oauth:
    account-id: ${ZOOM_OAUTH_ACCOUNT_ID:placeholder-account-id}
    client-id: ${ZOOM_OAUTH_CLIENT_ID:placeholder-client-id}
    client-secret: ${ZOOM_OAUTH_CLIENT_SECRET:placeholder-client-secret}